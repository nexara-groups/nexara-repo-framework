name = "nexara-foundation"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Static assets emitted by OpenNext.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# --- Platform bindings consumed ONLY by CloudflarePlatformProvider ---
# Business logic never reads these directly; it goes through PlatformProvider.

# KV namespace for the platform cache + KV access.
[[kv_namespaces]]
binding = "NEXARA_KV"
id = "209d50b154d5407590fc2fbc82a29e09"

# Queue producer for PlatformProvider.enqueue().
[[queues.producers]]
binding = "NEXARA_QUEUE"
queue = "nexara-jobs"

# A consumer trigger belongs only to a Worker that implements a queue handler.
# Yojo currently publishes to this queue only; no consumer is registered here.

# Cron triggers for PlatformProvider scheduled jobs.
[triggers]
crons = ["0 * * * *"]

# Non-secret vars. Secrets (SUPABASE_SERVICE_ROLE_KEY, etc.) via `wrangler secret put`.
[vars]
APP_ENV = "production"
