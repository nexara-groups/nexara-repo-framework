<!--
  Google Consent Mode v2 — paste inside <head>, replacing G-XXXXXXXXXX with your
  GA4 Measurement ID. The consent 'default' block MUST run before gtag('config').
  Everything is DENIED until the visitor consents; consent.js flips analytics on.
-->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  // 1) Default everything to DENIED (no analytics/ad cookies until opt-in).
  gtag('consent', 'default', {
    'ad_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied',
    'analytics_storage': 'denied',
    'functionality_storage': 'granted',
    'security_storage': 'granted',
    'wait_for_update': 500
  });

  // 2) Re-apply a previously saved choice so consent persists across pages/visits.
  //    Keep this storage key in sync with CONFIG.storeKey in consent.js.
  try {
    var _cc = JSON.parse(localStorage.getItem('cc-consent') || 'null');
    if (_cc && _cc.analytics === true) {
      gtag('consent', 'update', { 'analytics_storage': 'granted' });
    }
  } catch (e) {}

  // 3) Initialise GA (still cookieless until consent is granted above).
  gtag('config', 'G-XXXXXXXXXX');
</script>
